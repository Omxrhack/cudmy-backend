services:
  postgres:
    image: postgres:16-alpine
    container_name: cudmy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cudmy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cudmy}
      POSTGRES_DB: ${POSTGRES_DB:-cudmy_auth}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crea cudmy_verification en el primer arranque del volumen.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-cudmy} -d ${POSTGRES_DB:-cudmy_auth}']
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    container_name: cudmy-nats
    restart: unless-stopped
    command: ['-m', '8222']
    ports:
      - '4222:4222'
      - '8222:8222'

volumes:
  pgdata:
